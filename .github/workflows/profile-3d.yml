# Regenerates the 3D contribution graph shown in README.md.
# yoshi389111/github-profile-3d-contrib reads the public contribution calendar for this
# account (which already includes private contributions, because "Include private
# contributions on my profile" is on) and writes SVGs to profile-3d-contrib/.
# Actions are pinned to full commit SHAs, never floating tags.
name: Profile 3D contributions

on:
  schedule:
    - cron: "17 10 * * *" # daily, 04:17 CST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.1.0
      - uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit the regenerated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No change in the contribution graph"
            exit 0
          fi
          git commit -m "chore(profile): regenerate the 3D contribution graph [skip ci]"
          git push
