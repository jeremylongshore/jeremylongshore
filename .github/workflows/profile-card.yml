name: profile card

# Regenerates card_light.svg and card_dark.svg from the live GitHub API.
#
# Every number on the card is fetched at run time. Nothing is hardcoded, so the
# card cannot quietly go stale the way a hand-written "500+ commits" line does.
#
# The default GITHUB_TOKEN cannot see private contribution counts. To include
# them, add a classic PAT with `read:user` as a repo secret named PROFILE_TOKEN;
# without it the card still builds and simply reports the public figures.

on:
  schedule:
    - cron: '17 */6 * * *'      # every six hours, off the hour to dodge the stampede
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/build_card.py'
      - 'assets/portrait.txt'
      - '.github/workflows/profile-card.yml'

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the card
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_card.py

      - name: Commit only if the numbers actually moved
        run: |
          if git diff --quiet -- card_light.svg card_dark.svg; then
            echo "No change in the stats — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card_light.svg card_dark.svg
          git commit -m "chore(card): refresh profile stats [skip ci]"
          git push
